name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core C++ tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure
        # inkkit is fetched from GitHub by CMake; the companion (standard library
        # only) generates the interop fixture during the build.
        run: cmake -S test -B test/build

      - name: Build
        run: cmake --build test/build -j

      - name: Test
        run: ctest --test-dir test/build --output-on-failure

  companion-tests:
    name: Companion Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run pytest
        working-directory: companion
        run: python -m pytest -q

      - name: Rebuild the sample archive from source and sanity check it
        working-directory: companion
        # A byte for byte comparison is avoided on purpose: zlib output can differ
        # between versions. Instead the archive is rebuilt and checked
        # functionally (article count and a search hit), which is what matters.
        run: |
          python -m pocketwiki build markdown sample_content -o /tmp/sample.pwa -n "Foundations of Science"
          python -m pocketwiki inspect /tmp/sample.pwa --search isaac | tee /tmp/inspect.txt
          grep -q "Articles:     50" /tmp/inspect.txt
          grep -q "Isaac Newton" /tmp/inspect.txt

  firmware-build:
    name: Firmware build (PlatformIO)
    runs-on: ubuntu-latest
    # Builds the firmware for both Xteink targets. The complete device layer
    # (real HAL + vendored SDK hardware libraries) comes from inkkit, pinned in
    # platformio.ini. A green build verifies compile-and-link for the target;
    # on-device behaviour is tracked in docs/HARDWARE_TESTING.md.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Environments build one at a time: pio package installs are not safe to
      # run concurrently against a shared ~/.platformio.
      - name: Build X4 firmware
        run: pio run -e xteink_x4

      - name: Build X3 firmware
        run: pio run -e xteink_x3

      - name: Upload X4 artefact
        uses: actions/upload-artifact@v4
        with:
          name: pocketwiki-xteink_x4-firmware
          path: .pio/build/xteink_x4/firmware.bin
          if-no-files-found: error

      - name: Upload X3 artefact
        uses: actions/upload-artifact@v4
        with:
          name: pocketwiki-xteink_x3-firmware
          path: .pio/build/xteink_x3/firmware.bin
          if-no-files-found: error
