<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="PocketWiki: offline reference reader for Xteink X4 and X3 e-readers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151a"/>
      <stop offset="1" stop-color="#1e2530"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf1"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>

  <!-- device mock on the right -->
  <g transform="translate(936,44)">
    <rect x="0" y="0" width="300" height="272" rx="22" fill="#23262c" stroke="#3a4049" stroke-width="2"/>
    <rect x="22" y="22" width="256" height="200" rx="6" fill="url(#paper)" stroke="#0e1013" stroke-width="2"/>
    <rect x="22" y="22" width="256" height="30" fill="#23262c"/>
    <rect x="34" y="30" width="120" height="12" rx="3" fill="#ffffff"/>
    <g fill="#23262c">
      <rect x="34" y="66" width="230" height="9" rx="2"/>
      <rect x="34" y="84" width="210" height="9" rx="2"/>
      <rect x="34" y="102" width="120" height="9" rx="2" fill="#4f80ff"/>
      <rect x="34" y="120" width="228" height="9" rx="2"/>
      <rect x="34" y="138" width="180" height="9" rx="2"/>
      <rect x="34" y="164" width="90" height="16" rx="3"/>
      <rect x="34" y="190" width="150" height="9" rx="2"/>
    </g>
    <circle cx="150" cy="247" r="9" fill="none" stroke="#5b6270" stroke-width="4"/>
  </g>

  <!-- wordmark and tagline -->
  <g font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">
    <text x="90" y="150" fill="#ffffff" font-size="82" font-weight="700" letter-spacing="1">Pocket<tspan fill="#4f80ff">Wiki</tspan></text>
  </g>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="94" y="196" fill="#c7cdd6" font-size="25">Offline reference reader for Xteink X4 and X3 e-readers</text>
    <text x="94" y="230" fill="#8b93a1" font-size="18">Read compressed article collections from the SD card. No Wi-Fi needed.</text>

    <!-- feature chips -->
    <g font-size="16" fill="#cfd6df">
      <rect x="94" y="258" width="140" height="34" rx="17" fill="#2a3340" stroke="#3a4a5e"/>
      <text x="110" y="280">Offline first</text>
      <rect x="248" y="258" width="184" height="34" rx="17" fill="#2a3340" stroke="#3a4a5e"/>
      <text x="264" y="280">Incremental search</text>
      <rect x="446" y="258" width="150" height="34" rx="17" fill="#2a3340" stroke="#3a4a5e"/>
      <text x="462" y="280">Internal links</text>
      <rect x="610" y="258" width="118" height="34" rx="17" fill="#2a3340" stroke="#3a4a5e"/>
      <text x="626" y="280">ESP32-C3</text>
    </g>
  </g>
</svg>
