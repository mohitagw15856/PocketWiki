; PlatformIO project for the PocketWiki firmware (Xteink X4/X3, ESP32-C3).
;
; The firmware depends on inkkit for the device layer. inkkit is written against
; an ecosystem HAL (HalDisplay, HalStorage, HalGPIO, HalPowerManager) that it does
; not itself ship; hal/ provides that interface (see hal/HalStorage.h and
; docs/INKKIT_GAPS.md). The portable core in core/ and the HAL in hal/ are added
; as extra source so they compile into the firmware.
;
; The host unit tests do NOT go through PlatformIO; they use CMake under test/.
; See test/CMakeLists.txt and the CI workflow.

[platformio]
default_envs = xteink_x4
src_dir = src

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; Compile the portable core and the HAL shim alongside the firmware.
build_src_filter =
  +<*>
  +<../core/pocketwiki/PwaReader.cpp>
  +<../core/third_party/puff/puff.c>
  +<../hal/hal_shim.cpp>

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -std=gnu++2a
  -Isrc
  -Icore
  -Icore/third_party/puff
  -Ihal

lib_deps =
  https://github.com/mohitagw15856/inkkit.git

[env:xteink_x4]
extends = base

[env:xteink_x3]
extends = base
; The X3 shares the ESP32-C3 and firmware; a smaller panel is handled at runtime
; through the inkkit Display dimensions, so no separate build flags are needed.
build_flags =
  ${base.build_flags}
  -DPOCKETWIKI_DEVICE_X3=1
