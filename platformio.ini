; PlatformIO project for the PocketWiki firmware (Xteink X4/X3, ESP32-C3).
;
; The firmware depends on inkkit (pinned below) for the complete device layer:
; the Hal* HAL and the vendored SDK hardware libraries ship inside inkkit, so
; there is no local shim and no freeink-sdk wiring. The portable core in core/
; is added as extra source so it compiles into the firmware.
;
; The host unit tests do NOT go through PlatformIO; they use CMake under test/.
; See test/CMakeLists.txt and the CI workflow.
;
; Note: run pio environments one at a time (pio run -e <env>); concurrent pio
; invocations race on the shared ~/.platformio package directory.

[platformio]
default_envs = xteink_x4
src_dir = src

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; Compile the portable core alongside the firmware.
build_src_filter =
  +<*>
  +<../core/pocketwiki/PwaReader.cpp>
  +<../core/third_party/puff/puff.c>

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -std=gnu++2a
  -Isrc
  -Icore
  -Icore/third_party/puff

lib_deps =
  ; Canonical inkkit pin: the complete device layer (HAL + vendored SDK).
  https://github.com/mohitagw15856/inkkit.git#v0.1.0-rc1

[env:xteink_x4]
extends = base

[env:xteink_x3]
extends = base
; The X3 shares the ESP32-C3 and firmware; the smaller panel is handled at
; runtime by the inkkit device layer, so the two environments are identical
; and exist to ship a named .bin per target.
